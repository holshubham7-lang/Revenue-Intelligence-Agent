name: Check

# Both apps are built and tested from a clean checkout with no `.env` at all,
# which is also what proves the committed tree is self-contained rather than
# depending on a file someone forgot to add. Passing `Check` is what a PR to
# `dev` or `main` is judged on.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [features, dev, main]

jobs:
  api:
    runs-on: ubuntu-latest
    # The identity suites talk to MongoDB, so CI gives them a real server rather
    # than a mock: a mock proves the code agrees with itself, not that the unique
    # indexes it depends on exist. `identity.test-env.ts` pins every write to the
    # `revops_oauth_test` database, so no run can touch another one.
    services:
      mongodb:
        image: mongodb/mongodb-community-server:7.0-ubuntu2204
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The deployed app is the only thing that runs `dist`, so this check is
      # what stands between a specifier the compiler cannot rewrite and a green
      # build that 500s in production.
      - run: npm run check:dist

  frontend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-community-server:7.0-ubuntu2204
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Before `typecheck`: the route types `tsc` needs are generated by the
      # build, and a fresh checkout has no `.next`.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: frontend/lib and api/src still match
        run: node scripts/check-mirrors.mjs

  # Branch protection is a paid feature on a private repository, so nothing on
  # GitHub's side actually refuses a direct push to `dev` or `main`. This checks
  # for one instead: the tip of either branch must be a commit that arrived as a
  # merged PR from the branch above it. Review would have got that signal from
  # protection; until the repository can have it, a failing `flow` job is it.
  flow:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the tip arrived through a PR
        env:
          SHA: ${{ github.event.after }}
          SOURCE: ${{ github.ref_name == 'dev' && 'features' || 'dev' }}
          API: https://api.github.com/repos/${{ github.repository }}/commits
          TOKEN: ${{ github.token }}
        run: |
          # All zeros means the branch was deleted, so there is no tip to judge.
          case "$SHA" in
            *[!0]*) ;;
            *) echo "branch deleted; nothing to verify"; exit 0 ;;
          esac

          json=$(curl -s -H "authorization: Bearer $TOKEN" \
                      -H "accept: application/vnd.github+json" "$API/$SHA/pulls") \
            || { echo "Could not ask GitHub about $SHA. Failing rather than passing on a shrug."; exit 1; }

          pr=$(printf '%s' "$json" | jq --arg base "$GITHUB_REF_NAME" --arg head "$SOURCE" \
                 '[.[] | select(.base.ref == $base and .head.ref == $head and .merged_at != null)] | first // empty')

          if [ -z "$pr" ]; then
            echo "$SHA is not the merge of a PR from \`$SOURCE\` into \`$GITHUB_REF_NAME\`."
            echo "What GitHub reports for it, which will be empty for a direct push:"
            printf '%s' "$json" | jq -c '[.[] | {number, base: .base.ref, head: .head.ref, merged_at}]'
            echo "Open a PR from \`$SOURCE\` into \`$GITHUB_REF_NAME\` and let this job judge that instead."
            exit 1
          fi

          printf '%s' "$pr" | jq '"Arrived as merge of PR #" + (.number | tostring) + ": " + .title'
