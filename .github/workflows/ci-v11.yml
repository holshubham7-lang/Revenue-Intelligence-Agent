name: Check v1.1 (pull request)

# `development` is protected, so a v1.1 branch reaches it through a PR. This is
# the check that review can lean on: both apps are built and tested from a clean
# checkout with no `.env` at all, which is also what proves the committed tree is
# self-contained rather than depending on a file someone forgot to add.

on:
  pull_request:
    branches: [development]
    paths: ['v1.1/**', '.github/workflows/ci-v11.yml']

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.1/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v1.1/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.1/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v1.1/frontend/package-lock.json
      - run: npm ci
      # Before `typecheck`: the route types `tsc` needs are generated by the
      # build, and a fresh checkout has no `.next`.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: frontend/lib and api/src still match
        run: node v1.1/scripts/check-mirrors.mjs
